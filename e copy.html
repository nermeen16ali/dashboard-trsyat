<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المعلومات الاساسيه</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a9a8a;
        }

        body {
            background-color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }

        .modal-header-custom {
            background-color: var(--primary-color);
            color: #fff;
            padding: 16px;
            text-align: center;
        }

        .modal-header-custom h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        .modal-body-custom {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }

        .choices {
            margin-bottom: 0;
        }

        .choices__inner {
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 10px 14px;
            background: #fff;
            min-height: 48px;
            font-size: 14px;
        }

        .choices__inner:hover {
            border-color: var(--primary-color);
        }

        .choices[data-type*="select-one"] .choices__inner {
            padding-bottom: 10px;
        }

        .choices__list--dropdown {
            border-radius: 10px;
            border: 1px solid #e5e5e5;
        }

        .choices__list--dropdown .choices__item--selectable.is-highlighted {
            background-color: rgba(26, 154, 138, 0.1);
            color: var(--primary-color);
        }

        .choices__placeholder {
            color: #999;
            opacity: 1;
        }

        /* Hide selected items inside the multi-select */
        .choices[data-type*="select-multiple"] .choices__list--multiple {
            display: none;
        }

        /* Selected tags container */
        .selected-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .selected-tag {
            background-color: var(--primary-color);
            color: #fff;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .selected-tag .remove-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            padding: 0;
            font-size: 14px;
            line-height: 1;
            opacity: 0.8;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .selected-tag .remove-btn:hover {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="modal-card">
        <div class="modal-header-custom">
            <h2>المعلومات الاساسيه</h2>
        </div>

        <div class="modal-body-custom">
            <!-- حالة المنافسة -->
            <div class="form-group">
                <label>حالة المنافسة</label>
                <select id="competition-status" class="form-select">
                    <option value="" placeholder>اختر حاله المنافسه</option>
                    <option value="active">نشط</option>
                    <option value="pending">قيد الانتظار</option>
                    <option value="closed">مغلق</option>
                    <option value="cancelled">ملغي</option>
                </select>
            </div>

            <!-- المناطق -->
            <div class="form-group">
                <label>المناطق</label>
                <select id="regions" class="form-select" multiple>
                    <option value="riyadh">الرياض</option>
                    <option value="jeddah">جدة</option>
                    <option value="dammam">الدمام</option>
                    <option value="makkah">مكة المكرمة</option>
                    <option value="madinah">المدينة المنورة</option>
                </select>
                <div id="regions-tags" class="selected-tags"></div>
            </div>

            <!-- موقع التسليم -->
            <div class="form-group">
                <label>موقع التسليم</label>
                <select id="delivery-location" class="form-select">
                    <option value="" placeholder>اختر موقع التسليم</option>
                    <option value="location1">موقع التسليم 1</option>
                    <option value="location2">موقع التسليم 2</option>
                    <option value="location3">موقع التسليم 3</option>
                </select>
            </div>

            <!-- النوع -->
            <div class="form-group">
                <label>النوع</label>
                <select id="type" class="form-select">
                    <option value="" placeholder>اختر النوع المنافسه</option>
                    <option value="type1">نوع 1</option>
                    <option value="type2">نوع 2</option>
                    <option value="type3">نوع 3</option>
                </select>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <script>
        // حالة المنافسة
        new Choices('#competition-status', {
            searchEnabled: true,
            searchPlaceholderValue: 'بحث...',
            itemSelectText: '',
            noResultsText: 'لا توجد نتائج',
            shouldSort: false
        });

        // المناطق - Multi Select with external tags
        const regionsSelect = new Choices('#regions', {
            searchEnabled: true,
            searchPlaceholderValue: 'بحث...',
            removeItemButton: false,
            itemSelectText: '',
            noResultsText: 'لا توجد نتائج',
            placeholderValue: 'اختر المناطق',
            shouldSort: false
        });

        const regionsTagsContainer = document.getElementById('regions-tags');

        function updateRegionsTags() {
            const selectedValues = regionsSelect.getValue(true);
            const selectedItems = regionsSelect.getValue();

            regionsTagsContainer.innerHTML = '';

            if (Array.isArray(selectedItems)) {
                selectedItems.forEach(item => {
                    const tag = document.createElement('span');
                    tag.className = 'selected-tag';
                    tag.innerHTML = `
          ${item.label}
          <button type="button" class="remove-btn" data-value="${item.value}">✕</button>
        `;
                    regionsTagsContainer.appendChild(tag);
                });
            }
        }

        // Listen for changes
        document.getElementById('regions').addEventListener('change', updateRegionsTags);

        // Remove tag on click
        regionsTagsContainer.addEventListener('click', function (e) {
            if (e.target.classList.contains('remove-btn')) {
                const valueToRemove = e.target.getAttribute('data-value');
                regionsSelect.removeActiveItemsByValue(valueToRemove);
                updateRegionsTags();
            }
        });

        // موقع التسليم
        new Choices('#delivery-location', {
            searchEnabled: true,
            searchPlaceholderValue: 'بحث...',
            itemSelectText: '',
            noResultsText: 'لا توجد نتائج',
            shouldSort: false
        });

        // النوع
        new Choices('#type', {
            searchEnabled: true,
            searchPlaceholderValue: 'بحث...',
            itemSelectText: '',
            noResultsText: 'لا توجد نتائج',
            shouldSort: false
        });
    </script>

</body>

</html>
